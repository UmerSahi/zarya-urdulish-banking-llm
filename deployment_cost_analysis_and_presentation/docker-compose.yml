version: '3.8'

services:
  # 1. High-Performance Model Serving & FastAPI Gateway
  zarya-api-gateway:
    build:
      context: ..
      dockerfile: deployment_cost_analysis_and_presentation/Dockerfile
    container_name: zarya-banking-api
    restart: always
    environment:
      - APP_ENV=production
      - MODEL_ENGINE=vLLM_Qwen2.5_3B_UrduLish
      - SBP_GUARDRAILS_ENFORCED=true
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../Adaptors:/app/Adaptors
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 2. Modern Streamlit Customer Chat & CRM Dashboard
  zarya-streamlit-ui:
    build:
      context: ..
      dockerfile: deployment_cost_analysis_and_presentation/Dockerfile
    container_name: zarya-banking-ui
    restart: always
    command: ["streamlit", "run", "deployment_cost_analysis_and_presentation/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - ZARYA_API_URL=http://zarya-api-gateway:8000
    ports:
      - "8501:8501"
    depends_on:
      - zarya-api-gateway

